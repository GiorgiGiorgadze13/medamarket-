name: MedaMarket Daily Database Backup & Encryption

on:
  schedule:
    # Runs daily at 03:00 UTC (07:00 AM Georgia time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_weekly:
        description: 'Force a copy to weekly retention folder'
        required: false
        type: boolean
        default: false

jobs:
  backup:
    name: Backup, Encrypt & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Latest PostgreSQL Client (PGDG 17) & Tools
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17 openssl
          pg_dump --version

      - name: Verify Environment Secrets
        env:
          CHECK_DB_URL: ${{ secrets.BACKUP_DATABASE_URL || secrets.DATABASE_URL }}
          CHECK_S3_KEY: ${{ secrets.S3_ACCESS_KEY_ID }}
          CHECK_S3_SECRET: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          CHECK_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          CHECK_ENC_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          MISSING=0
          if [ -z "$CHECK_DB_URL" ]; then
            echo "::error::Missing DATABASE_URL or BACKUP_DATABASE_URL secret in repository settings"
            MISSING=1
          fi
          if [ -z "$CHECK_S3_KEY" ]; then
            echo "::error::Missing S3_ACCESS_KEY_ID secret in repository settings"
            MISSING=1
          fi
          if [ -z "$CHECK_S3_SECRET" ]; then
            echo "::error::Missing S3_SECRET_ACCESS_KEY secret in repository settings"
            MISSING=1
          fi
          if [ -z "$CHECK_S3_BUCKET" ]; then
            echo "::error::Missing S3_BUCKET_NAME secret in repository settings"
            MISSING=1
          fi
          if [ -z "$CHECK_ENC_KEY" ]; then
            echo "::error::Missing BACKUP_ENCRYPTION_KEY secret in repository settings"
            MISSING=1
          fi

          if [ $MISSING -eq 1 ]; then
            echo "Please configure the missing repository secrets under GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Run Database Dump, Compress & Encrypt
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL || secrets.DATABASE_URL }}
          ENC_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -eo pipefail
          # Enforce secret masking
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$ENC_KEY"

          export PGSSLMODE=require

          TIMESTAMP=$(date -u +'%Y%m%d_%H%M%S')
          DAY_OF_WEEK=$(date -u +'%u') # 7 = Sunday
          BACKUP_NAME="medamarket_${TIMESTAMP}.sql.gz"
          ENC_BACKUP_NAME="${BACKUP_NAME}.enc"

          mkdir -p ./backups
          echo "Executing pg_dump from Neon PostgreSQL..."
          pg_dump --no-owner --no-privileges --clean --if-exists "$DB_URL" > "./backups/temp_dump.sql"

          # Verify dump is non-empty
          RAW_SIZE=$(stat -c%s "./backups/temp_dump.sql" || echo 0)
          if [ "$RAW_SIZE" -lt 100 ]; then
            echo "::error::pg_dump failed or produced an empty dump ($RAW_SIZE bytes)"
            exit 1
          fi
          echo "Database dump completed successfully ($RAW_SIZE bytes raw SQL)."

          echo "Compressing SQL dump with gzip level 9..."
          gzip -9 -c "./backups/temp_dump.sql" > "./backups/${BACKUP_NAME}"
          rm -f "./backups/temp_dump.sql"

          GZIP_SIZE=$(stat -c%s "./backups/${BACKUP_NAME}" || echo 0)
          echo "Compression complete ($GZIP_SIZE bytes gzip)."

          echo "Encrypting backup with AES-256-CBC (PBKDF2 100,000 iterations)..."
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
            -in "./backups/${BACKUP_NAME}" \
            -out "./backups/${ENC_BACKUP_NAME}" \
            -pass pass:"$ENC_KEY"

          # Calculate SHA-256 checksum
          sha256sum "./backups/${ENC_BACKUP_NAME}" > "./backups/${ENC_BACKUP_NAME}.sha256"
          echo "Encrypted file checksum: $(cat ./backups/${ENC_BACKUP_NAME}.sha256)"

          # Set output environment variables for next steps
          echo "ENC_BACKUP_FILE=./backups/${ENC_BACKUP_NAME}" >> $GITHUB_ENV
          echo "BACKUP_FILENAME=${ENC_BACKUP_NAME}" >> $GITHUB_ENV
          echo "DAY_OF_WEEK=${DAY_OF_WEEK}" >> $GITHUB_ENV

          # Shred unencrypted gzip immediately
          rm -f "./backups/${BACKUP_NAME}"
          echo "Local unencrypted files shredded."

      - name: Upload to Offsite Storage (Cloudflare R2 / AWS S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || 'auto' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          FORCE_WEEKLY: ${{ github.event.inputs.force_weekly }}
        run: |
          set -eo pipefail
          ENDPOINT_FLAG=""
          if [ -n "$S3_ENDPOINT" ]; then
            ENDPOINT_FLAG="--endpoint-url $S3_ENDPOINT"
          fi

          echo "Uploading encrypted backup to daily retention folder..."
          aws s3 cp $ENDPOINT_FLAG "$ENC_BACKUP_FILE" "s3://${S3_BUCKET}/daily/${BACKUP_FILENAME}"
          aws s3 cp $ENDPOINT_FLAG "${ENC_BACKUP_FILE}.sha256" "s3://${S3_BUCKET}/daily/${BACKUP_FILENAME}.sha256"

          # If today is Sunday (day 7) or forced weekly, upload to weekly folder
          if [ "$DAY_OF_WEEK" -eq 7 ] || [ "$FORCE_WEEKLY" = "true" ]; then
            echo "Weekly retention condition met (Sunday or manual flag). Uploading to weekly folder..."
            aws s3 cp $ENDPOINT_FLAG "$ENC_BACKUP_FILE" "s3://${S3_BUCKET}/weekly/${BACKUP_FILENAME}"
            aws s3 cp $ENDPOINT_FLAG "${ENC_BACKUP_FILE}.sha256" "s3://${S3_BUCKET}/weekly/${BACKUP_FILENAME}.sha256"
          fi

          echo "Upload to offsite storage completed successfully."

      - name: Apply Retention Policy (Keep 7 Daily & 4 Weekly)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || 'auto' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -eo pipefail
          ENDPOINT_FLAG=""
          if [ -n "$S3_ENDPOINT" ]; then
            ENDPOINT_FLAG="--endpoint-url $S3_ENDPOINT"
          fi

          echo "Checking daily retention policy (retaining newest 7 snapshots)..."
          # List all daily .enc files sorted reverse alphabetically (newest first)
          aws s3 ls $ENDPOINT_FLAG "s3://${S3_BUCKET}/daily/" 2>/dev/null | grep '\.enc$' | sort -r | awk '{print $4}' > /tmp/all_daily.txt || true

          TOTAL_DAILY=$(wc -l < /tmp/all_daily.txt || echo 0)
          echo "Total daily backups found: $TOTAL_DAILY"
          if [ "$TOTAL_DAILY" -gt 7 ]; then
            tail -n +8 /tmp/all_daily.txt | while read -r OLD_FILE; do
              if [ -n "$OLD_FILE" ]; then
                echo "Pruning expired daily backup: $OLD_FILE"
                aws s3 rm $ENDPOINT_FLAG "s3://${S3_BUCKET}/daily/${OLD_FILE}"
                aws s3 rm $ENDPOINT_FLAG "s3://${S3_BUCKET}/daily/${OLD_FILE}.sha256" 2>/dev/null || true
              fi
            done
          fi

          echo "Checking weekly retention policy (retaining newest 4 snapshots)..."
          aws s3 ls $ENDPOINT_FLAG "s3://${S3_BUCKET}/weekly/" 2>/dev/null | grep '\.enc$' | sort -r | awk '{print $4}' > /tmp/all_weekly.txt || true

          TOTAL_WEEKLY=$(wc -l < /tmp/all_weekly.txt || echo 0)
          echo "Total weekly backups found: $TOTAL_WEEKLY"
          if [ "$TOTAL_WEEKLY" -gt 4 ]; then
            tail -n +5 /tmp/all_weekly.txt | while read -r OLD_FILE; do
              if [ -n "$OLD_FILE" ]; then
                echo "Pruning expired weekly backup: $OLD_FILE"
                aws s3 rm $ENDPOINT_FLAG "s3://${S3_BUCKET}/weekly/${OLD_FILE}"
                aws s3 rm $ENDPOINT_FLAG "s3://${S3_BUCKET}/weekly/${OLD_FILE}.sha256" 2>/dev/null || true
              fi
            done
          fi

          echo "Retention policy successfully enforced."
