name: Diagnose Encryption Key Secret Fingerprint

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Compute Secret SHA-256 Fingerprint
    runs-on: ubuntu-latest
    steps:
      - name: Compute Secret Fingerprint
        env:
          ENC_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -eo pipefail
          # Enforce masking
          echo "::add-mask::$ENC_KEY"

          if [ -z "$ENC_KEY" ]; then
            echo "::error::Secret BACKUP_ENCRYPTION_KEY is empty or not set in GitHub Repository Secrets!"
            exit 1
          fi

          # Compute SHA-256 hash of the exact secret (no extra newline)
          EXACT_HASH=$(printf "%s" "$ENC_KEY" | sha256sum | awk '{print $1}')

          # Compute SHA-256 hash with newlines/carriage returns stripped
          STRIPPED_HASH=$(printf "%s" "$ENC_KEY" | tr -d '\r\n' | sha256sum | awk '{print $1}')

          # Character count
          KEY_LEN=${#ENC_KEY}

          # Check for leading/trailing whitespace or quotes
          HAS_LEADING_SPACE="No"
          HAS_TRAILING_SPACE="No"
          HAS_ENCLOSING_QUOTES="No"

          if [[ "$ENC_KEY" =~ ^[[:space:]] ]]; then
            HAS_LEADING_SPACE="Yes"
          fi
          if [[ "$ENC_KEY" =~ [[:space:]]$ ]]; then
            HAS_TRAILING_SPACE="Yes"
          fi
          if [[ "$ENC_KEY" =~ ^[\"'].*[\"']$ ]]; then
            HAS_ENCLOSING_QUOTES="Yes"
          fi

          echo "================================================================"
          echo "GITHUB ACTIONS SECRET DIAGNOSTIC REPORT (Zero Secret Exposure)"
          echo "================================================================"
          echo "Secret Name:             BACKUP_ENCRYPTION_KEY"
          echo "Length:                  $KEY_LEN characters"
          echo "Exact SHA-256 Hash:      $EXACT_HASH"
          echo "Trimmed (no CRLF) Hash:  $STRIPPED_HASH"
          echo "----------------------------------------------------------------"
          echo "Formatting Analysis:"
          echo "  - Leading Whitespace:  $HAS_LEADING_SPACE"
          echo "  - Trailing Whitespace: $HAS_TRAILING_SPACE"
          echo "  - Enclosing Quotes:    $HAS_ENCLOSING_QUOTES"
          echo "================================================================"

