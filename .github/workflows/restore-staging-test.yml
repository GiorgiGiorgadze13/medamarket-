name: MedaMarket Staging Restore Test

on:
  workflow_dispatch:
    inputs:
      backup_filename:
        description: 'Specific backup filename to restore (e.g. medamarket_20261113_170432.sql.gz.enc) or leave blank for latest'
        required: false
        default: ''

jobs:
  restore-test:
    name: Restore & Verify Staging Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Latest PostgreSQL Client (PGDG 17), Tools & Rclone
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates gnupg lsb-release jq

          # Setup PostgreSQL official repository (PGDG 17)
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17 openssl

          # Install latest rclone
          curl -fsSL https://rclone.org/install.sh | sudo bash

          psql --version
          rclone version

      - name: Verify Secrets, Enforce Host Allowlist & Strict Production Isolation
        env:
          PROD_DB_URL: ${{ secrets.BACKUP_DATABASE_URL || secrets.DATABASE_URL }}
          STAGING_DB_URL: ${{ secrets.STAGING_DATABASE_URL }}
          ENC_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -eo pipefail
          # Enforce secret masking across all logs
          echo "::add-mask::$STAGING_DB_URL"
          if [ -n "$PROD_DB_URL" ]; then echo "::add-mask::$PROD_DB_URL"; fi
          if [ -n "$ENC_KEY" ]; then echo "::add-mask::$ENC_KEY"; fi

          # Check mandatory secrets
          if [ -z "$STAGING_DB_URL" ]; then
            echo "::error::Missing STAGING_DATABASE_URL secret in GitHub Actions repository secrets."
            echo "Please add STAGING_DATABASE_URL under GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -z "$ENC_KEY" ]; then
            echo "::error::Missing BACKUP_ENCRYPTION_KEY secret."
            exit 1
          fi

          if [ -z "$GDRIVE_TOKEN" ] && [ -z "$RCLONE_CONF_DATA" ]; then
            echo "::error::Missing RCLONE_GDRIVE_TOKEN (or RCLONE_CONFIG) secret for Google Drive access."
            exit 1
          fi

          # Execute strict safety verification and parse connection parameters into PG env vars
          node -e '
            const { URL } = require("url");

            const stagingUrl = process.env.STAGING_DB_URL;
            const prodUrl = process.env.PROD_DB_URL;

            // 1. Validate URL protocol
            if (!stagingUrl.startsWith("postgres://") && !stagingUrl.startsWith("postgresql://")) {
              console.error("::error::STAGING_DATABASE_URL must be a valid postgresql:// URI.");
              process.exit(1);
            }

            let staging;
            try {
              staging = new URL(stagingUrl);
            } catch (err) {
              console.error("::error::Failed to parse STAGING_DATABASE_URL:", err.message);
              process.exit(1);
            }

            const stagingHost = staging.hostname.toLowerCase();
            const stagingPort = staging.port || "5432";
            const stagingDb = staging.pathname.replace(/^\//, "").toLowerCase();
            const stagingUser = decodeURIComponent(staging.username || "");
            const stagingPass = decodeURIComponent(staging.password || "");
            const stagingSsl = staging.searchParams.get("sslmode") || "require";

            // 2. Exact Staging Host Allowlist
            const ALLOWED_STAGING_HOSTS = [
              "ep-dry-queen-bej17wkv.c-9.us-east-2.aws.neon.tech",
              "ep-dry-queen-bej17wkv-pooler.c-9.us-east-2.aws.neon.tech"
            ];

            if (!ALLOWED_STAGING_HOSTS.includes(stagingHost)) {
              console.error("::error::CRITICAL SAFETY BLOCK: STAGING_DATABASE_URL host (" + stagingHost + ") does not match the exact allowed Neon staging-test endpoint!");
              console.error("Expected endpoint: ep-dry-queen-bej17wkv.c-9.us-east-2.aws.neon.tech");
              process.exit(1);
            }

            // 3. Exact Database Name Check
            if (stagingDb !== "neondb") {
              console.error("::error::CRITICAL SAFETY BLOCK: Database name must be exactly '\''neondb'\'' (received: '\''" + stagingDb + "'\'').");
              process.exit(1);
            }

            // 4. Production Database Comparison Checks
            if (prodUrl) {
              if (stagingUrl.trim() === prodUrl.trim()) {
                console.error("::error::CRITICAL SAFETY BLOCK: STAGING_DATABASE_URL exactly matches production DATABASE_URL! Restoration into production is strictly blocked.");
                process.exit(1);
              }
              try {
                const prod = new URL(prodUrl);
                if (stagingHost === prod.hostname.toLowerCase()) {
                  console.error("::error::CRITICAL SAFETY BLOCK: STAGING_DATABASE_URL host matches production host (" + prod.hostname + ")! Aborted.");
                  process.exit(1);
                }
              } catch (e) {
                // Ignore parse errors on prodUrl
              }
            }

            // 5. Export individual PG connection variables to $GITHUB_ENV (prevents passing URL on command line)
            const fs = require("fs");
            const envFile = process.env.GITHUB_ENV;
            if (envFile) {
              fs.appendFileSync(envFile, `PGHOST=${stagingHost}\n`);
              fs.appendFileSync(envFile, `PGPORT=${stagingPort}\n`);
              fs.appendFileSync(envFile, `PGDATABASE=${stagingDb}\n`);
              fs.appendFileSync(envFile, `PGUSER=${stagingUser}\n`);
              fs.appendFileSync(envFile, `PGPASSWORD=${stagingPass}\n`);
              fs.appendFileSync(envFile, `PGSSLMODE=${stagingSsl}\n`);
            }

            console.log("::add-mask::" + stagingPass);
            console.log("::add-mask::" + stagingUser);
            console.log("Safety checks passed: Target is confirmed to be the exact authorized Neon staging-test endpoint (ep-dry-queen-bej17wkv, db: neondb).");
          '

      - name: Configure Rclone for Google Drive
        env:
          GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -eo pipefail
          mkdir -p ~/.config/rclone

          if [ -n "$RCLONE_CONF_DATA" ]; then
            echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          else
            printf "[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n" "$GDRIVE_TOKEN" > ~/.config/rclone/rclone.conf
          fi

          echo "Verifying Google Drive connection..."
          rclone lsd gdrive: || {
            echo "::error::Failed to connect to Google Drive. Please verify RCLONE_GDRIVE_TOKEN."
            exit 1
          }
          echo "Google Drive connection established."

      - name: Download Encrypted Backup and Checksum from Google Drive
        env:
          SPECIFIED_FILE: ${{ github.event.inputs.backup_filename }}
        run: |
          set -eo pipefail
          mkdir -p ./restore

          TARGET_FILE="$SPECIFIED_FILE"
          if [ -z "$TARGET_FILE" ]; then
            echo "Querying Google Drive for the latest backup in MedaMarket-Backups/daily/ ..."
            TARGET_FILE=$(rclone lsf "gdrive:MedaMarket-Backups/daily/" 2>/dev/null | grep '\.enc$' | sort -r | head -n 1 || echo "")
            if [ -z "$TARGET_FILE" ]; then
              echo "::error::No encrypted backup files (.enc) found in Google Drive folder 'MedaMarket-Backups/daily/'."
              exit 1
            fi
            echo "Selected latest backup: $TARGET_FILE"
          else
            echo "Using user-specified backup file: $TARGET_FILE"
          fi

          echo "Downloading $TARGET_FILE from Google Drive..."
          rclone copyto "gdrive:MedaMarket-Backups/daily/${TARGET_FILE}" "./restore/${TARGET_FILE}"

          echo "Downloading ${TARGET_FILE}.sha256 checksum from Google Drive..."
          rclone copyto "gdrive:MedaMarket-Backups/daily/${TARGET_FILE}.sha256" "./restore/${TARGET_FILE}.sha256"

          FILESIZE=$(stat -c%s "./restore/${TARGET_FILE}" || echo 0)
          if [ "$FILESIZE" -lt 100 ]; then
            echo "::error::Downloaded backup file is invalid or too small ($FILESIZE bytes)."
            exit 1
          fi

          echo "BACKUP_FILE_PATH=./restore/${TARGET_FILE}" >> $GITHUB_ENV
          echo "TARGET_FILENAME=${TARGET_FILE}" >> $GITHUB_ENV
          echo "Download complete ($FILESIZE bytes)."

      - name: Verify SHA-256 Checksum Integrity Before Decryption
        run: |
          set -eo pipefail
          echo "Verifying SHA-256 integrity for $TARGET_FILENAME ..."

          if [ ! -f "${BACKUP_FILE_PATH}.sha256" ]; then
            echo "::error::Matching checksum file ${TARGET_FILENAME}.sha256 is missing."
            exit 1
          fi

          EXPECTED_HASH=$(awk '{print $1}' "${BACKUP_FILE_PATH}.sha256" | tr '[:upper:]' '[:lower:]')
          ACTUAL_HASH=$(sha256sum "$BACKUP_FILE_PATH" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')

          echo "Expected Hash: $EXPECTED_HASH"
          echo "Actual Hash:   $ACTUAL_HASH"

          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "::error::Checksum verification failed! File may be corrupted or modified."
            exit 1
          fi

          echo "SUCCESS: SHA-256 checksum verified cleanly."

      - name: Decrypt & Decompress Backup
        env:
          ENC_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -eo pipefail
          echo "::add-mask::$ENC_KEY"

          echo "Decrypting backup using AES-256-CBC PBKDF2 (100,000 iterations)..."
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 100000 \
            -in "$BACKUP_FILE_PATH" \
            -out "./restore/decrypted_dump.sql.gz" \
            -pass pass:"$ENC_KEY"

          echo "Decompressing gzip archive..."
          gunzip -c "./restore/decrypted_dump.sql.gz" > "./restore/restore_dump.sql"
          rm -f "./restore/decrypted_dump.sql.gz"

          SQL_SIZE=$(stat -c%s "./restore/restore_dump.sql" || echo 0)
          if [ "$SQL_SIZE" -lt 100 ]; then
            echo "::error::Decrypted SQL dump is empty ($SQL_SIZE bytes)."
            exit 1
          fi

          echo "SUCCESS: Decrypted and decompressed SQL dump ready ($SQL_SIZE bytes)."

      - name: Execute Staging Database Restoration via psql
        run: |
          set -eo pipefail
          # Unset production database URLs to guarantee zero accidental connection
          unset DATABASE_URL
          unset BACKUP_DATABASE_URL

          echo "Executing restore against Neon staging database using environment variables (ON_ERROR_STOP=1)..."
          # Invoked without passing connection URL or passwords in command-line arguments
          psql -v ON_ERROR_STOP=1 -f "./restore/restore_dump.sql"

          echo "================================================================"
          echo "SUCCESS: Database restoration script executed without errors."
          echo "================================================================"

      - name: Verify Restored Tables & Record Counts
        run: |
          set -eo pipefail
          unset DATABASE_URL
          unset BACKUP_DATABASE_URL

          node -e '
            const fs = require("fs");
            const { spawnSync } = require("child_process");

            // 1. Read dump file to detect which tables contain data in the backup
            const sqlContent = fs.readFileSync("./restore/restore_dump.sql", "utf8");
            const tables = ["Category", "InventoryHistory", "Product", "Sale", "SaleItem", "User"];
            const dumpHasData = {};

            for (const table of tables) {
              const copyRegex = new RegExp(`COPY\\s+(?:public\\.)?["\x27]?${table}["\x27]?\\s+[^\\n]*FROM stdin;([\\s\\S]*?)\\\\?\\.`, "i");
              const copyMatch = sqlContent.match(copyRegex);
              let hasRows = copyMatch && copyMatch[1].trim().length > 0;
              if (!hasRows) {
                const insertRegex = new RegExp(`INSERT\\s+INTO\\s+(?:public\\.)?["\x27]?${table}["\x27]?`, "i");
                hasRows = insertRegex.test(sqlContent);
              }
              dumpHasData[table] = Boolean(hasRows);
            }

            // 2. Query record counts from staging database via psql environment variables
            const query = `
              SELECT json_build_object(
                \x27Category\x27, (SELECT count(*) FROM "Category"),
                \x27InventoryHistory\x27, (SELECT count(*) FROM "InventoryHistory"),
                \x27Product\x27, (SELECT count(*) FROM "Product"),
                \x27Sale\x27, (SELECT count(*) FROM "Sale"),
                \x27SaleItem\x27, (SELECT count(*) FROM "SaleItem"),
                \x27User\x27, (SELECT count(*) FROM "User")
              )::text;
            `;

            const res = spawnSync("psql", ["-v", "ON_ERROR_STOP=1", "-t", "-A", "-c", query], {
              encoding: "utf8"
            });

            if (res.status !== 0 || !res.stdout) {
              console.error("::error::Failed to query staging database counts:", res.stderr);
              process.exit(1);
            }

            let counts;
            try {
              counts = JSON.parse(res.stdout.trim());
            } catch (err) {
              console.error("::error::Failed to parse counts JSON from psql:", res.stdout);
              process.exit(1);
            }

            // 3. Compare counts against dump expectations
            let allPassed = true;
            console.log("================================================================");
            console.log("DATABASE RESTORATION VERIFICATION REPORT");
            console.log("================================================================");
            console.log("| Table Name         | Rows in Dump | Restored Count | Status                                |");
            console.log("|--------------------|--------------|----------------|---------------------------------------|");

            for (const table of tables) {
              const expected = dumpHasData[table];
              const count = Number(counts[table] || 0);
              let status = "PASSED";

              if (expected && count === 0) {
                status = "FAILED (Expected data but table is empty)";
                allPassed = false;
              } else if (!expected && count === 0) {
                status = "PASSED (Empty in dump, empty in DB)";
              } else if (count > 0) {
                status = "PASSED (Populated)";
              }

              const tableNamePadded = table.padEnd(18);
              const dumpPadded = (expected ? "Yes" : "No").padEnd(12);
              const countPadded = String(count).padEnd(14);
              console.log(`| ${tableNamePadded} | ${dumpPadded} | ${countPadded} | ${status.padEnd(37)} |`);
            }
            console.log("================================================================");

            if (!allPassed) {
              console.error("\n::error::Verification failed! One or more tables expected to contain data are empty.");
              process.exit(1);
            }

            console.log("\nDISASTER RECOVERY STAGING TEST COMPLETED SUCCESSFULLY!");
            console.log("All verification checks passed.");
          '

      - name: Temporary-File Cleanup
        if: always()
        run: |
          rm -rf ./restore
          echo "Temporary restore files cleaned up."
