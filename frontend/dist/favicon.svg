<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glass Reflection / Ambient Glow Gradient -->
    <linearGradient id="ambientGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bag Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>

    <!-- Golden/Amber Sparkle Accent -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35" />
    </filter>

    <filter id="handleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#022c22" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Emerald Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Top Glass Highlight -->
  <rect width="512" height="256" rx="128" fill="url(#ambientGlow)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.2" />

  <!-- Shopping Bag Graphic with Shadows -->
  <g filter="url(#dropShadow)">
    <!-- Bag Handle -->
    <path
      d="M 196 210 V 160 C 196 122, 316 122, 316 160 V 210"
      fill="none"
      stroke="url(#handleGrad)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#handleShadow)"
    />

    <!-- Bag Body -->
    <path
      d="M 136 214 L 160 398 C 163 414, 176 424, 192 424 L 320 424 C 336 424, 349 414, 352 398 L 376 214 C 378 198, 366 186, 350 186 L 162 186 C 146 186, 134 198, 136 214 Z"
      fill="#ffffff"
    />

    <!-- Stylized 'M' inside bag (Meda Market brand symbol) -->
    <path
      d="M 214 266 L 256 322 L 298 266"
      fill="none"
      stroke="#059669"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 194 266 V 356"
      fill="none"
      stroke="#059669"
      stroke-width="22"
      stroke-linecap="round"
    />
    <path
      d="M 318 266 V 356"
      fill="none"
      stroke="#059669"
      stroke-width="22"
      stroke-linecap="round"
    />

    <!-- Sparkle Star Accent on Bag (representing quality/freshness) -->
    <path
      d="M 356 142 Q 356 166 380 166 Q 356 166 356 190 Q 356 166 332 166 Q 356 166 356 142 Z"
      fill="url(#sparkleGrad)"
    />
  </g>
</svg>
